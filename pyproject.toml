[project]
name = "research-hub"
version = "0.1.0"
description = "Lifecycle from a research question on a rig to a released version."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "pydantic>=2", "uvicorn>=0.32"]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "algorithms"]
